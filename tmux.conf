# ── Prefix key ───────────────────────────────────────────────────
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ── General ──────────────────────────────────────────────────────
set -g default-terminal "tmux-256color"
set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -sg escape-time 0
set -g focus-events on
set -g display-time 2000
set -g set-clipboard on
setw -g mode-keys vi

# ── Splits ───────────────────────────────────────────────────────
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# ── Pane navigation (vim-style) ──────────────────────────────────
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# ── Pane resizing ────────────────────────────────────────────────
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# ── Reload config ────────────────────────────────────────────────
bind r source-file ~/.tmux.conf \; display "  Config reloaded"

# ── Status bar ───────────────────────────────────────────────────
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1e1e2e"
set -g status-left-length 40
set -g status-right-length 120

# Left: session name
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold]  #S #[bg=#1e1e2e,fg=#cba6f7] #[default]"

# Right: folder | git branch | time
set -g status-right "#[fg=#313244]#[bg=#313244,fg=#89b4fa]  #{b:pane_current_path}#[bg=#313244,fg=#45475a]  #[bg=#313244,fg=#a6e3a1]#(cd #{q:pane_current_path} && git branch --show-current 2>/dev/null)#[bg=#1e1e2e,fg=#313244]#[bg=#1e1e2e,fg=#cba6f7]  %H:%M "

# Window tabs
set -g window-status-current-format "#[bg=#cba6f7,fg=#1e1e2e,bold]  #W  #[bg=#1e1e2e,fg=#cba6f7]"
set -g window-status-format "#[bg=#313244,fg=#6c7086]  #W  #[bg=#1e1e2e,fg=#313244]"
set -g window-status-separator ""

# Pane borders
set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# Message / command bar
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g message-command-style "bg=#313244,fg=#cba6f7"